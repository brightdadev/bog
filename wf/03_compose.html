<!DOCTYPE html><html><head><title>Send Message</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone-frame">
    <div class="header">
        <a href="02_home.html" style="color: #333; text-decoration: none; font-size: 16px;">&larr; Back</a>
        <h1>New Message</h1>
        <div style="width: 24px;"></div>
    </div>
    <div class="content">
        <div class="input-group">
            <label>Who should get this?</label>
            <select class="select-field">
                <option>All Members (1,240 people)</option>
                <option>Choir Members (45 people)</option>
                <option>Youth Fellowship (120 people)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>Type your message</label>
            <textarea class="textarea-field" rows="5" placeholder="e.g. Dear Member, welcome to Sunday service...">Dear Member, this is a reminder for our Sunday service this weekend. God bless you.</textarea>
            <div style="text-align: right; font-size: 12px; color: #666; margin-top: 5px;">112 characters used (includes compliance text)</div>
        </div>

        <h2 style="font-size: 16px; margin: 20px 0 10px; font-weight: normal;">Cost Summary</h2>
        <div class="box-light">
            <div class="cost-row"><span class="text-muted">Number of people</span><span>1,240</span></div>
            <div class="cost-row"><span class="text-muted">Skipped (opt-out/DND)</span><span>2</span></div>
            <div class="cost-row"><span class="text-muted">Segments per message</span><span>1</span></div>
            <div class="cost-row"><span class="text-muted">Cost per message</span><span>₦ 5.00</span></div>
            <div class="cost-row"><span>Total cost</span><span>₦ 6,200.00</span></div>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn btn-primary">Send Now</button>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="02_home.html" class="nav-item">Home</a>
        <a href="04_campaigns.html" class="nav-item">History</a>
        <a href="05_settings.html" class="nav-item">Settings</a>
    </div>
</div>
</body></html>
