<!DOCTYPE html><html><head><title>Login</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone-frame">
    <div class="content" style="display: flex; flex-direction: column; justify-content: center; padding: 40px 20px;">
        <div class="logo-box">BOG</div>
        <h1 style="text-align: center; font-size: 22px; margin-bottom: 5px;">Welcome</h1>
        <p style="text-align: center; color: #666; margin-bottom: 40px; font-size: 14px;">God's Banner of Grace</p>
        
        <div class="input-group">
            <label>Email or Username</label>
            <input type="text" class="input-field" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" class="input-field" placeholder="Enter your password">
        </div>
        
        <button class="btn btn-primary mt-4">Sign In</button>
        <a href="#" style="text-align: center; display: block; margin-top: 20px; color: #333; text-decoration: underline; font-size: 14px;">Forgot password?</a>
    </div>
</div>
</body></html>
