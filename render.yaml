#
# BOG — God's Banner of Grace Ministries · Bulk SMS Broadcast Tool
# @file    render.yaml
# @author  Bright Da Dev
# @phase   1 — Skeleton & contracts
# @purpose Render Blueprint declaring the web API + background worker services.
#
services:
  - type: web
    name: bog-api-web
    rootDir: server
    buildCommand: npm ci && npm run build && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMARTSMS_TOKEN
        sync: false
      - key: SMARTSMS_SENDER
        sync: false
      - key: CHURCH_ID
        sync: false
      - key: SMS_RATE_NGN
        value: "5"
      - key: QUIET_START
        value: "21:00"
      - key: QUIET_END
        value: "07:00"
      - key: TZ
        value: "Africa/Lagos"

  - type: worker
    name: bog-api-worker
    rootDir: server
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: node dist/src/workers/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMARTSMS_TOKEN
        sync: false
      - key: SMARTSMS_SENDER
        sync: false
      - key: CHURCH_ID
        sync: false
      - key: SMS_RATE_NGN
        value: "5"
      - key: QUIET_START
        value: "21:00"
      - key: QUIET_END
        value: "07:00"
      - key: TZ
        value: "Africa/Lagos"